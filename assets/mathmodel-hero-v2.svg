<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">mathmodel-skill — a high-contrast neon modelling workflow</title>
  <desc id="desc">A neon control-room style banner showing the mathematical modelling core connected to input, solve, validate and deliver stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.52" stop-color="#111936"/>
      <stop offset="1" stop-color="#201442"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5b0"/>
      <stop offset="0.48" stop-color="#55c7ff"/>
      <stop offset="1" stop-color="#b58cff"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6b7cff" stop-opacity="0.34"/>
      <stop offset="0.62" stop-color="#21356e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0b1024" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#9db0ff" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="955" cy="178" r="245" fill="url(#halo)"/>
  <path d="M0 302C210 264 314 340 520 292S870 258 1200 308" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <g font-family="Inter,Segoe UI,Helvetica Neue,Arial,sans-serif">
    <text x="62" y="56" font-size="20" font-weight="700" letter-spacing="1.8" fill="#7debd0">OPEN-SOURCE AGENT WORKFLOW · v7.4.5</text>
    <text x="60" y="122" font-size="56" font-weight="750" letter-spacing="-1.5" fill="#ffffff">mathmodel-skill</text>
    <rect x="63" y="143" width="210" height="5" rx="2.5" fill="url(#neon)"/>
    <text x="62" y="181" font-size="30" font-weight="650" fill="#e9efff">Model. Validate. Deliver.</text>
    <text x="62" y="211" font-size="21" fill="#aab8dd">Stateful · evidence-first · built for teams.</text>

    <g transform="translate(62 248)">
      <rect x="0" y="0" width="132" height="62" rx="14" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="18" y="27" font-size="26" font-weight="750" fill="#ffffff">10</text>
      <text x="18" y="48" font-size="15" letter-spacing="1" fill="#98a9d7">STAGES</text>
    </g>
    <g transform="translate(206 248)">
      <rect x="0" y="0" width="132" height="62" rx="14" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="18" y="27" font-size="26" font-weight="750" fill="#ffffff">3</text>
      <text x="18" y="48" font-size="15" letter-spacing="1" fill="#98a9d7">CONTESTS</text>
    </g>
    <g transform="translate(350 248)">
      <rect x="0" y="0" width="154" height="62" rx="14" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="18" y="27" font-size="26" font-weight="750" fill="#ffffff">1</text>
      <text x="18" y="48" font-size="15" letter-spacing="1" fill="#98a9d7">DELIVERY PACK</text>
    </g>

    <g transform="translate(760 44)">
      <text x="0" y="0" font-size="18" font-weight="700" letter-spacing="1.7" fill="#9fbbff">EVIDENCE CONTROL ROOM</text>
      <circle cx="198" cy="154" r="142" fill="none" stroke="#8392ff" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4 9"/>
      <circle cx="198" cy="154" r="104" fill="none" stroke="url(#neon)" stroke-opacity="0.35" stroke-width="2"/>
      <ellipse cx="198" cy="154" rx="142" ry="46" fill="none" stroke="#55c7ff" stroke-opacity="0.28" stroke-width="1.5" transform="rotate(-28 198 154)"/>
      <ellipse cx="198" cy="154" rx="142" ry="46" fill="none" stroke="#c18cff" stroke-opacity="0.22" stroke-width="1.5" transform="rotate(28 198 154)"/>
      <circle cx="198" cy="154" r="67" fill="#151e46" stroke="url(#neon)" stroke-width="3" filter="url(#softGlow)"/>
      <circle cx="198" cy="154" r="53" fill="#0b1027" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="198" y="164" text-anchor="middle" font-size="42" font-weight="800" fill="#ffffff">M</text>
      <circle cx="198" cy="12" r="5" fill="#00e5b0" filter="url(#tinyGlow)"/>
      <circle cx="329" cy="154" r="5" fill="#55c7ff" filter="url(#tinyGlow)"/>
      <circle cx="198" cy="296" r="5" fill="#b58cff" filter="url(#tinyGlow)"/>
      <circle cx="67" cy="154" r="5" fill="#ff62c8" filter="url(#tinyGlow)"/>

      <g transform="translate(18 54)">
        <rect width="112" height="34" rx="17" fill="#111b3b" stroke="#00e5b0" stroke-opacity="0.65"/>
        <circle cx="17" cy="17" r="4" fill="#00e5b0"/>
        <text x="30" y="22" font-size="15" font-weight="700" fill="#dffef6">INPUT</text>
      </g>
      <g transform="translate(266 54)">
        <rect width="112" height="34" rx="17" fill="#111b3b" stroke="#55c7ff" stroke-opacity="0.65"/>
        <circle cx="17" cy="17" r="4" fill="#55c7ff"/>
        <text x="30" y="22" font-size="15" font-weight="700" fill="#e4f7ff">SOLVE</text>
      </g>
      <g transform="translate(18 220)">
        <rect width="112" height="34" rx="17" fill="#111b3b" stroke="#ff62c8" stroke-opacity="0.65"/>
        <circle cx="17" cy="17" r="4" fill="#ff62c8"/>
        <text x="30" y="22" font-size="15" font-weight="700" fill="#ffe9f8">PAPER</text>
      </g>
      <g transform="translate(266 220)">
        <rect width="112" height="34" rx="17" fill="#111b3b" stroke="#b58cff" stroke-opacity="0.65"/>
        <circle cx="17" cy="17" r="4" fill="#b58cff"/>
        <text x="30" y="22" font-size="15" font-weight="700" fill="#f0e9ff">QA</text>
      </g>
    </g>
  </g>
</svg>
