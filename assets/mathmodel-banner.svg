<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">mathmodel-skill: reproducible mathematical modeling workflow</title>
  <desc id="desc">A ten-stage pipeline from problem statement to reproducible delivery package.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10162d"/>
      <stop offset="0.55" stop-color="#1b2146"/>
      <stop offset="1" stop-color="#31205a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10a37f"/>
      <stop offset="1" stop-color="#8b7cf6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1060" cy="-10" r="180" fill="#8b7cf6" opacity="0.12"/>
  <circle cx="1150" cy="270" r="130" fill="#10a37f" opacity="0.10"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="68" y="92" font-size="48" font-weight="700" letter-spacing="-1" fill="#ffffff">mathmodel-skill</text>
    <rect x="70" y="116" width="92" height="4" rx="2" fill="url(#accent)"/>
    <text x="68" y="156" font-size="22" fill="#dbe5ff">From problem to reproducible delivery.</text>
    <text x="68" y="191" font-size="15" fill="#aeb9d8">CUMCM · MCM/ICM · Diangong Cup · cross-agent · auditable</text>

    <g transform="translate(68 238)">
      <rect x="0" y="0" width="230" height="38" rx="19" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.20"/>
      <circle cx="22" cy="19" r="6" fill="#10a37f" filter="url(#glow)"/>
      <text x="40" y="25" font-size="14" fill="#ffffff">Autopilot / Guided</text>
    </g>

    <g transform="translate(430 58)">
      <text x="0" y="0" font-size="13" font-weight="700" letter-spacing="2" fill="#9fbbff">10-STAGE PIPELINE</text>
      <path d="M 10 80 H 660" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <g fill="#1b2146" stroke="#b8c6ff" stroke-width="2">
        <circle cx="10" cy="80" r="13"/><circle cx="82" cy="80" r="13"/><circle cx="154" cy="80" r="13"/>
        <circle cx="226" cy="80" r="13"/><circle cx="298" cy="80" r="13"/><circle cx="370" cy="80" r="13"/>
        <circle cx="442" cy="80" r="13"/><circle cx="514" cy="80" r="13"/><circle cx="586" cy="80" r="13"/><circle cx="658" cy="80" r="13"/>
      </g>
      <g fill="#ffffff" font-size="11" text-anchor="middle">
        <text x="10" y="84">0</text><text x="82" y="84">1</text><text x="154" y="84">2</text><text x="226" y="84">3</text><text x="298" y="84">4</text>
        <text x="370" y="84">5</text><text x="442" y="84">6</text><text x="514" y="84">7</text><text x="586" y="84">8</text><text x="658" y="84">9</text>
      </g>
      <g fill="#aeb9d8" font-size="12">
        <text x="0" y="126">source</text><text x="190" y="126">model</text><text x="362" y="126">evidence</text><text x="548" y="126">paper</text><text x="626" y="156">QA</text>
      </g>
      <path d="M 14 164 C 100 140, 155 187, 240 160 S 390 141, 470 168 S 590 142, 660 164" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
      <text x="0" y="205" font-size="14" fill="#dbe5ff">state  →  real code  →  robustness  →  PDF  →  manifest</text>
    </g>
  </g>
</svg>
