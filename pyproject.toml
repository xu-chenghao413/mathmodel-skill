[project]
name = "mathmodel-skill"
version = "7.4.6"
description = "Provider-agnostic mathematical modeling competition workflow with reproducible evidence and delivery gates."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "xu-chenghao413" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "coverage==7.6.4",
  "numpy==1.26.4",
  "scipy==1.13.1",
  "pandas==2.2.3",
  "matplotlib==3.9.2",
  "seaborn==0.13.2",
  "scikit-learn==1.5.2",
  "PyYAML==6.0.2",
  "reportlab==4.2.5",
  "unidiff==0.7.5",
  "ruff==0.8.4",
  "pip-audit==2.8.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.coverage.run]
branch = true
source = ["scripts", "templates/shared/code_starter"]
