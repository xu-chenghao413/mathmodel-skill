name: Bug report
description: Report a reproducible problem in the skill, scripts, templates, or installer.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove team names, school names, contest identifiers, credentials,
        private paths, unpublished manuscripts, and source documents before posting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v7.4.1 or 395539a
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Agent client and version
      placeholder: Codex, Claude Code, Cursor, VS Code/Copilot, OpenCode, or other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest synthetic input and exact command or prompt.
      placeholder: |
        1. Run ...
        2. Provide synthetic input ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Paste redacted logs or a failure summary; do not upload private files.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private data, credentials, unpublished papers, and third-party materials.
          required: true
