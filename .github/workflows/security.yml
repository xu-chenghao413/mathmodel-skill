name: Security and quality

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL / Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # GitHub Code Scanning is not available for every private-repository plan.
      # Keep this required check green while preserving CodeQL for public repos
      # (or private repos where Code Scanning is enabled).
      - name: Explain CodeQL skip when Code Scanning is unavailable
        if: ${{ github.event.repository.visibility != 'public' }}
        run: |
          echo "CodeQL analysis skipped: Code Scanning is unavailable for this repository visibility/plan."
          echo "Secret scanning, dependency auditing, and Ruff checks still run below."
      - name: Check out repository
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Initialize CodeQL
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          languages: python
      - name: Analyze
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b # v3

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan history with Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check --no-cache-dir pip-audit==2.8.0
      - name: Audit pinned CI dependencies
        run: pip-audit -r .github/requirements-ci.txt --progress-spinner off

  lint:
    name: Ruff syntax and safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check --no-cache-dir ruff==0.8.4
      - name: Run Ruff
        run: ruff check --select E9,F63,F7,F82 scripts examples templates/shared/code_starter
