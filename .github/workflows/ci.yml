name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/mathmodel-matplotlib
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML reportlab unidiff numpy scipy pandas matplotlib seaborn scikit-learn

      - name: Compile Python sources
        run: python -m compileall -q scripts templates/shared/code_starter

      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run competition preflights
        run: |
          python scripts/doctor.py --competition cumcm --skip-tools --require-codex
          python scripts/doctor.py --competition mcm --skip-tools
          python scripts/doctor.py --competition diangong --skip-tools

  install-smoke:
    name: Portable install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run portable install smoke test
        run: python scripts/smoke_install.py

      - name: Run synthetic quickstart
        run: python examples/quickstart/run_demo.py --output "${{ runner.temp }}/mathmodel-demo-output"
