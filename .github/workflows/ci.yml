name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ github.workspace }}/.ci-matplotlib
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prepare runtime directories
        run: python -c "import os; from pathlib import Path; Path(os.environ['MPLCONFIGDIR']).mkdir(parents=True, exist_ok=True)"

      - name: Install pinned test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/requirements-ci.txt

      - name: Compile Python sources
        run: python -m compileall -q scripts examples/quickstart templates/shared/code_starter

      - name: Verify repository structure and CLIs
        run: python scripts/verify_project.py --check-cli --require-yaml

      - name: Validate agent contract fixtures
        run: |
          python scripts/validate_eval.py --list-cases
          python scripts/validate_eval.py --case cumcm_autopilot_blocked
          python scripts/validate_eval.py --case mcm_guided_confirmation
          python scripts/validate_eval.py --case diangong_delivery_gate

      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Collect coverage baseline (Ubuntu / Python 3.12)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m coverage run --branch --source=scripts,templates/shared/code_starter -m unittest discover -s tests -p "test_*.py" -q
          python -m coverage report --fail-under=30
          python -m coverage xml -o coverage.xml

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml

      - name: Run competition preflights
        run: |
          python scripts/doctor.py --competition cumcm --skip-tools --require-codex
          python scripts/doctor.py --competition mcm --skip-tools
          python scripts/doctor.py --competition diangong --skip-tools

  install-smoke:
    name: Portable install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run portable install smoke test
        run: python scripts/smoke_install.py

      - name: Run synthetic quickstart
        run: python examples/quickstart/run_demo.py --output "${{ runner.temp }}/mathmodel-demo-output"
